[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
# cargo-deny >= 0.18: feature selection lives here, not on the CLI
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
git-fetch-with-cli = true
yanked = "warn"
# cargo-deny >= 0.18: these are scopes now, not severity levels
unmaintained = "workspace"
unsound = "workspace"
ignore = [
    # Consciously tolerated (migrated from audit.toml when cargo-audit was
    # retired in favor of this single security gate):
    # paste v1.0.15 is unmaintained (RUSTSEC-2024-0436). Pulled in
    # transitively by ratatui 0.29; ratatui 0.30 dropped it but required a
    # newer rustc at the time.
    "RUSTSEC-2024-0436",
    # lru 0.12 unsound findings, also transitive via ratatui 0.29.
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0253",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
confidence-threshold = 0.8
allow = [
    # scrapmf itself
    "GPL-3.0-only",
    # dependencies actually present in the tree
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

[licenses.private]
ignore = false
registries = []
